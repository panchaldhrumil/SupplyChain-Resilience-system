[project]
name = "backend"
version = "0.1.0"
description = "India Energy Supply Chain Resilience — backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "newspaper3k>=0.2.8",
    "psycopg2-binary>=2.9.9",
    "qdrant-client>=1.9.0",
    "google-genai>=1.0.0",
    "yfinance>=0.2.40",
    "apscheduler>=3.10.4",
]

[tool.vercel]
entrypoint = "api.main:app"